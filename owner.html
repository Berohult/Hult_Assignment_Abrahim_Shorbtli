:root{
  --bg:#171310; --card:#211A13; --card2:#292018;
  --ink:#EFE7D8; --ink2:#CFC3AC; --muted:#9C8C74;
  --gold:#C9A25C; --gold2:#E2C283; --sand:#C8A882;
  --hair:rgba(201,162,92,.18); --hair2:rgba(201,162,92,.34);
  --green:#22A55A; --shadow:0 18px 50px rgba(0,0,0,.55);
  --f-d:"Noto Kufi Arabic",system-ui,sans-serif;
  --f-b:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,.28,1);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(90% 34% at 50% 0%,#241B10 0%,transparent 70%),var(--bg);
  color:var(--ink);font-family:var(--f-b);font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-size:16.5px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--gold2);text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:660px;margin:0 auto;padding:0 20px 80px}
header.top{position:sticky;top:0;z-index:40;background:rgba(23,19,16,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top-in{max-width:660px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-d);font-weight:700;font-size:17px;color:var(--gold2)}
.lang-pill{font-weight:600;font-size:12.5px;color:var(--ink2);border:1px solid var(--hair2);
  border-radius:999px;padding:6px 14px;transition:transform .18s var(--ease)}
.lang-pill:active{transform:scale(.96)}
.eyebrow{font-family:var(--f-d);font-weight:500;font-size:11.5px;color:var(--gold);text-transform:uppercase}
html[lang="en"] .eyebrow{letter-spacing:.16em}
h1{font-family:var(--f-d);font-weight:700;font-size:clamp(27px,7vw,40px);line-height:1.6;
  margin:14px 0 10px;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold2)}
h2{font-family:var(--f-d);font-weight:700;font-size:22px;line-height:1.6;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--ink2);font-size:15px;max-width:52ch;margin:0}
section{padding-top:58px}
.hero{padding-top:44px;text-align:center}
.hero .sub{margin:0 auto}

/* split visual */
.split{display:flex;gap:14px;justify-content:center;margin:34px 0 8px;align-items:stretch}
.phone{flex:1;max-width:250px;border:1px solid var(--hair2);border-radius:28px;overflow:hidden;
  background:#0E0B08;box-shadow:var(--shadow);position:relative}
.phone .ph-label{position:absolute;top:10px;inset-inline-start:50%;transform:translateX(50%);z-index:3;
  font-size:10px;font-weight:600;border-radius:999px;padding:3px 12px;white-space:nowrap}
html[dir="ltr"] .phone .ph-label{transform:translateX(-50%)}
.phone.bad .ph-label{background:rgba(160,60,40,.25);color:#E8A28F;border:1px solid rgba(196,85,59,.4)}
.phone.good .ph-label{background:rgba(34,165,90,.2);color:#8FE0B0;border:1px solid rgba(34,165,90,.45)}
.pdf-mock{height:100%;min-height:340px;display:grid;place-items:center;position:relative;overflow:hidden}
.pdf-sheet{width:150%;background:#E8E2D2;color:#333;transform:rotate(-7deg) scale(1.05);
  filter:blur(1.6px);padding:20px 26px;font-size:6.5px;line-height:2;font-family:serif}
.pdf-sheet td{border-bottom:1px dotted #999;padding:1px 4px;white-space:nowrap}
.pdf-hint{position:absolute;bottom:12px;inset-inline:12px;text-align:center;font-size:10.5px;
  color:#E8A28F;background:rgba(14,11,8,.8);border-radius:10px;padding:5px 8px}
.frame-holder{height:480px;position:relative}
.frame-holder iframe{width:390px;height:844px;border:0;transform:scale(.568);transform-origin:top left;
  position:absolute;top:0;left:0;background:#171310}
html[dir="rtl"] .frame-holder iframe{left:auto;right:0;transform-origin:top right}
.try-row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;
  border-radius:16px;padding:13px 22px;font-size:14.5px;transition:transform .18s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.gold{background:var(--gold);color:#1D1712}
.btn.ghost{border:1px solid var(--hair2);color:var(--ink)}
.btn.wa{background:var(--green);color:#fff;width:100%;font-size:16px;padding:16px}
.btn.wa svg{width:21px;height:21px;flex:none}
.qr-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.qr-box{border:1px solid var(--hair);border-radius:16px;padding:12px;background:var(--card)}
.qr-box svg{width:92px;height:92px;display:block}
.qr-cap{font-size:12px;color:var(--muted);max-width:20ch;text-align:start}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:26px}
.stat{border:1px solid var(--hair);border-radius:18px;background:var(--card);padding:18px 16px;text-align:center}
.stat .n{font-family:var(--f-d);font-weight:700;font-size:31px;color:var(--gold2);
  font-variant-numeric:tabular-nums;line-height:1.4;direction:ltr;unicode-bidi:isolate}
.stat .d{font-size:12.5px;color:var(--ink2);line-height:1.8}
.stat .a{font-size:10.5px;color:var(--muted);margin-top:6px;display:block}
.math{border:1px solid var(--gold);border-radius:20px;margin-top:16px;padding:20px 22px;
  background:linear-gradient(160deg,rgba(201,162,92,.10),transparent 55%)}
.math .big{font-family:var(--f-d);font-weight:700;font-size:19px;color:var(--gold2)}
.math p{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}

/* offer steps */
.steps{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.step{display:flex;gap:16px;border:1px solid var(--hair);border-radius:18px;background:var(--card);padding:18px}
.step .num{font-family:var(--f-d);font-weight:700;font-size:19px;color:#1D1712;width:38px;height:38px;
  flex:none;background:var(--gold);border-radius:12px;display:grid;place-items:center}
.step .s-t{font-family:var(--f-d);font-weight:500;font-size:15.5px;color:var(--ink)}
.step .s-d{font-size:13px;color:var(--ink2);margin-top:3px}
.close-line{text-align:center;font-family:var(--f-d);font-weight:500;font-size:15px;
  color:var(--sand);margin-top:18px}

/* wa mock */
.wa-mock{border:1px solid var(--hair);border-radius:20px;background:#0F1712;padding:18px;margin-top:22px}
.wa-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);
  padding-bottom:10px;margin-bottom:14px}
.wa-ava{width:34px;height:34px;border-radius:999px;background:var(--gold);color:#1D1712;
  display:grid;place-items:center;font-weight:700;font-family:var(--f-d)}
.wa-name{font-size:13px;font-weight:600}
.wa-name small{display:block;color:#7FBE9E;font-weight:400;font-size:10.5px}
.bubble{max-width:78%;border-radius:14px;padding:9px 14px;font-size:13px;margin-bottom:10px;position:relative}
.bubble small{display:block;font-size:9.5px;opacity:.55;margin-top:3px;text-align:end}
.bubble.them{background:#1E2A22;color:#DFE8E0;margin-inline-end:auto}
.bubble.us{background:#144D31;color:#E8F5EC;margin-inline-start:auto}

/* analytics mock */
.ana{border:1px solid var(--hair);border-radius:20px;background:var(--card);padding:20px;margin-top:16px}
.ana-title{display:flex;justify-content:space-between;align-items:baseline}
.ana-title b{font-family:var(--f-d);font-weight:500;font-size:14px}
.ana-title span{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:74px;margin-top:14px}
.bar{flex:1;background:var(--card2);border-radius:4px 4px 0 0;min-height:6%}
.bar.hot{background:var(--gold)}
.bars-x{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:5px}
.top5{margin:16px 0 0;padding:0;list-style:none;font-size:12.5px}
.top5 li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hair)}
.top5 .v{color:var(--muted);font-variant-numeric:tabular-nums}
.insight{border-inline-start:2px solid var(--gold);padding-inline-start:12px;margin-top:14px;
  font-size:12.5px;color:var(--sand)}
.langsplit{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:14px}
.langsplit .ar-f{background:var(--gold);width:72%}
.langsplit .en-f{background:var(--card2);flex:1}
.langsplit-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}

/* compare table */
.tblwrap{overflow-x:auto;margin-top:22px;border:1px solid var(--hair);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--hair);vertical-align:top}
thead th{font-family:var(--f-d);font-weight:500;font-size:12.5px;color:var(--sand);
  border-bottom:1px solid var(--hair2);white-space:nowrap}
td:last-child,th:last-child{background:rgba(201,162,92,.09)}
th:last-child{color:var(--gold2)}
td{color:var(--ink2)}
td .no{color:#B0806E}
td .yes{color:#8FD9B4}

/* trust */
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.tr-card{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:16px;text-align:center}
.tr-card .t-i{font-size:20px}
.tr-card .t-t{font-family:var(--f-d);font-weight:500;font-size:12.5px;margin-top:6px}
.tr-card .t-d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.8}
.stand{display:flex;justify-content:center;margin-top:26px}
.stand-mock{text-align:center}
.stand-card{width:150px;border:1px solid var(--hair2);border-radius:14px;background:var(--card);
  padding:16px 14px 12px;box-shadow:var(--shadow);position:relative}
.stand-card::after{content:"";position:absolute;bottom:-26px;left:50%;transform:translateX(-50%) perspective(60px) rotateX(45deg);
  width:70px;height:26px;background:var(--card2);border-radius:0 0 8px 8px}
.stand-card .brand-sm{font-family:var(--f-d);font-weight:700;color:var(--gold2);font-size:15px}
.stand-card svg{width:86px;height:86px;margin:10px auto 6px;display:block}
.stand-card .scan{font-size:9.5px;color:var(--muted)}
.stand-cap{font-size:11.5px;color:var(--muted);margin-top:40px}

/* founder */
.founder{border:1px solid var(--gold);border-radius:22px;margin-top:26px;padding:26px 22px;text-align:center;
  background:linear-gradient(170deg,rgba(201,162,92,.10),transparent 55%)}
.f-ava{width:64px;height:64px;border-radius:999px;background:var(--gold);color:#1D1712;
  display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:26px;margin:0 auto 12px}
.f-name{font-family:var(--f-d);font-weight:500;font-size:15px}
.f-line{font-size:13.5px;color:var(--ink2);margin:8px auto 18px;max-width:38ch}
.scarcity{text-align:center;font-size:12px;color:var(--sand);margin-top:16px}
footer{margin-top:60px;border-top:1px solid var(--hair);padding-top:24px;text-align:center;
  font-size:12px;color:var(--muted);line-height:2.2}
@media (prefers-reduced-motion:no-preference){
  .r{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .r.in{opacity:1;transform:none}
}
@media (max-width:560px){
  .split{flex-direction:column;align-items:center}
  .phone{width:100%;max-width:270px}
}
</style>

window.setLang=function(l){ if(l!==LANG){ LANG=l; localStorage.setItem("ms-lang",LANG); render(); } };
var io;
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target);} });
  },{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".r").forEach(function(el){io.observe(el);});
}
