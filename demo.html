/* ===== Fonts (self-hosted, subset) ===== */
@font-face{font-family:"Noto Kufi Arabic";font-style:normal;font-weight:500;font-display:swap;
  src:url(assets/fonts/noto-kufi-arabic-arabic-500-normal.woff2) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+0660-0669}
@font-face{font-family:"Noto Kufi Arabic";font-style:normal;font-weight:700;font-display:swap;
  src:url(assets/fonts/noto-kufi-arabic-arabic-700-normal.woff2) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E,U+0660-0669}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;
  src:url(assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;
  src:url(assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");
  unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;
  src:url(assets/fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+2000-206F,U+20A0-20CF}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;
  src:url(assets/fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+2000-206F,U+20A0-20CF}

/* ===== Tokens — "Majlis at night" ===== */
:root{
  --bg:#171310; --bg2:#1C1712; --card:#211A13; --card2:#292018;
  --ink:#EFE7D8; --ink2:#CFC3AC; --muted:#9C8C74;
  --gold:#C9A25C; --gold2:#E2C283; --sand:#C8A882;
  --hair:rgba(201,162,92,.18); --hair2:rgba(201,162,92,.34);
  --on-accent:#1D1712; --glass:rgba(23,19,16,.72); --glass2:rgba(38,30,21,.78);
  --glass3:rgba(38,30,21,.9); --scrimc:rgba(10,8,6,.6);
  --glow:rgba(226,194,131,.35); --glow2:rgba(226,194,131,.8);
  --watermark:rgba(201,162,92,.045); --tint:rgba(201,162,92,.10); --tint2:rgba(201,162,92,.08);
  --green:#7FBE9E; --shadow:0 18px 50px rgba(0,0,0,.55);
  --f-d:"Noto Kufi Arabic",system-ui,sans-serif;
  --f-b:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,.28,1); --dur:.42s;
  --maxw:560px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(90% 40% at 50% 0%,#221A11 0%,transparent 70%),
    var(--bg);
  color:var(--ink);font-family:var(--f-b);font-size:15.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
html[lang="ar"] body{font-size:16.5px}
img,svg{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--gold2);text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.page{max-width:var(--maxw);margin:0 auto;padding:0 18px 140px;
  transition:transform var(--dur) var(--ease),border-radius var(--dur) var(--ease)}
body.sheet-open .page{transform:scale(.96);border-radius:22px;overflow:hidden}
body.sheet-open{overflow:hidden}

/* eyebrow / labels */
.eyebrow{font-family:var(--f-d);font-weight:500;font-size:11.5px;color:var(--gold);
  text-transform:uppercase}
html[lang="en"] .eyebrow{letter-spacing:.16em}
html[lang="ar"] .eyebrow{letter-spacing:0}

/* ===== Header ===== */
header.top{
  position:sticky;top:0;z-index:40;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair);
}
.top-in{max-width:var(--maxw);margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.wordmark-sm{font-family:var(--f-d);font-weight:700;font-size:21px;color:var(--gold2);line-height:1.2}
.top-actions{display:flex;align-items:center;gap:8px}
.lang-pill{
  font-family:var(--f-b);font-weight:600;font-size:12.5px;color:var(--ink2);
  border:1px solid var(--hair2);border-radius:999px;padding:6px 14px;
  transition:transform .18s var(--ease),color .2s;
}
.lang-pill:active{transform:scale(.96)}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--hair2);
  display:grid;place-items:center;color:var(--gold2);transition:transform .18s var(--ease)}
.icon-btn:active{transform:scale(.96)}

/* chips bar */
.chips-wrap{position:sticky;top:59px;z-index:39;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair)}
.chips{max-width:var(--maxw);margin:0 auto;position:relative;
  display:flex;gap:4px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;
  scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;z-index:1;font-family:var(--f-b);font-weight:600;font-size:13px;
  color:var(--muted);padding:7px 14px;border-radius:999px;white-space:nowrap;
  transition:color .25s}
.chip.on{color:var(--on-accent)}
.glider{position:absolute;top:10px;left:0;height:33px;border-radius:999px;background:var(--gold);
  z-index:0;transition:transform .35s var(--ease),width .35s var(--ease);will-change:transform;
  opacity:0}
.glider.ready{opacity:1}

/* ===== Hero ===== */
.hero{padding:44px 0 8px;text-align:center}
.hero .greet{font-size:13px;color:var(--muted);min-height:1.6em}
.wordmark{
  font-family:var(--f-d);font-weight:700;color:var(--gold2);
  font-size:clamp(64px,20vw,104px);line-height:1.25;margin:2px 0 0;
}
@keyframes pour{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -8% 0)}}
.wordmark .mask{display:inline-block;animation:pour 1.2s var(--ease) .15s backwards}
.hero .cafe-name{font-family:var(--f-d);font-weight:500;font-size:14px;color:var(--ink2);margin-top:2px}
.hero .tagline{font-size:14.5px;color:var(--muted);margin-top:10px}
.hero .story{font-size:13.5px;color:var(--ink2);max-width:40ch;margin:14px auto 0;line-height:2}
.hero-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}
.hmchip{font-size:11.5px;color:var(--sand);border:1px solid var(--hair);
  border-radius:999px;padding:4px 12px}

/* ===== Parade (chef's marquee) ===== */
.parade{margin:26px -18px 4px;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.parade-track{display:flex;gap:12px;width:max-content;padding:6px 0;
  animation:marquee-ltr 36s linear infinite}
html[dir="rtl"] .parade-track{animation-name:marquee-rtl}
@keyframes marquee-ltr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marquee-rtl{from{transform:translateX(0)}to{transform:translateX(50%)}}
.parade:hover .parade-track,.parade:active .parade-track{animation-play-state:paused}
.ptile{flex:none;width:132px;border:1px solid var(--hair);border-radius:16px;
  background:var(--card);overflow:hidden;text-align:center;padding-bottom:10px;
  transition:transform .18s var(--ease)}
.ptile:active{transform:scale(.96)}
.ptile .art{height:84px;display:grid;place-items:center}
.ptile .art svg{width:44px;height:44px}
.ptile .nm{font-family:var(--f-d);font-weight:500;font-size:12px;color:var(--ink);
  padding:4px 8px 0;line-height:1.5}
.ptile .pr{font-family:var(--f-b);font-weight:600;font-size:13px;color:var(--gold2)}

/* ===== Chapters ===== */
.chapter{padding-top:34px;scroll-margin-top:118px}
.ch-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.ch-title{font-family:var(--f-d);font-weight:700;font-size:24px;color:var(--ink);margin:0;
  text-wrap:balance}
.ch-sub{font-size:13px;color:var(--muted);margin:2px 0 16px}
.divider{display:block;margin:6px auto 0;color:var(--hair2);width:100%}

/* item cards */
svg.item-ic{color:var(--gold)}
.items{display:flex;flex-direction:column;gap:14px}
.card{
  border:1px solid var(--hair);border-radius:20px;background:var(--card);
  overflow:hidden;text-align:start;width:100%;
  transition:transform .18s var(--ease),border-color .3s;
  position:relative;
}
.card:active{transform:scale(.97)}
.card .art{position:relative;display:grid;place-items:center;overflow:hidden}
.card.hero-card .art{height:190px;
  border-radius:260px 260px 0 0 / 340px 340px 0 0;margin:10px 10px 0}
.card.hero-card .art svg.item-ic{width:74px;height:74px}
.card .body{padding:14px 18px 16px}
.row-top{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.nm{font-family:var(--f-d);font-weight:500;font-size:17px;color:var(--ink);line-height:1.55}
.price{font-family:var(--f-b);font-weight:600;font-size:18px;color:var(--gold2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.price s{color:var(--muted);font-size:13px;font-weight:400;margin-inline-end:6px}
.desc{font-size:13.5px;color:var(--ink2);margin-top:3px;max-width:52ch}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 12px;margin-top:9px;
  font-size:11.5px;color:var(--muted)}
.meta .mi{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px;opacity:.85}
.badge{font-family:var(--f-b);font-weight:600;font-size:10.5px;color:var(--on-accent);
  background:var(--gold);border-radius:999px;padding:2.5px 10px;display:inline-block}
.badge.soft{background:none;color:var(--gold2);border:1px solid var(--hair2)}
.badges{position:absolute;top:18px;inset-inline-start:18px;display:flex;gap:6px;z-index:2}
.card.row-card .badges{position:static;margin-bottom:4px}
.pairs{margin-top:10px}
.pairs button{font-size:11.5px;color:var(--sand);border:1px dashed var(--hair2);
  border-radius:999px;padding:4px 12px;transition:transform .18s var(--ease)}
.pairs button:active{transform:scale(.95)}
.addb{
  position:absolute;bottom:14px;inset-inline-end:14px;z-index:2;
  width:36px;height:36px;border-radius:999px;background:var(--gold);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:20px;line-height:1;
  transition:transform .18s var(--ease);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.addb:active{transform:scale(.9)}
.card.row-card{display:flex;align-items:center;gap:0}
.card.row-card .body{flex:1;padding:13px 18px}
.card.row-card .addb{position:static;flex:none;margin-inline-end:14px}
.card.row-card .art.side{width:88px;align-self:stretch;min-height:104px;flex:none;
  border-radius:16px;margin:10px;margin-inline-end:0}
.card.row-card .art.side svg.item-ic{width:40px;height:40px}

/* provenance */
.prov{border-inline-start:2px solid var(--hair2);margin-inline-start:8px;
  padding-inline-start:18px;display:flex;flex-direction:column;gap:14px}
.origin{font-size:11.5px;color:var(--sand);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.tnotes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tnote{font-size:11px;color:var(--ink2);background:var(--card2);
  border:1px solid var(--hair);border-radius:999px;padding:3px 11px}
.methods{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.method{font-size:11.5px;color:var(--muted);border:1px solid var(--hair);border-radius:12px;
  padding:7px 12px;line-height:1.6}
.method b{display:block;color:var(--sand);font-family:var(--f-d);font-weight:500;font-size:12px}

/* reserve */
.reserve{border:1px solid var(--gold);border-radius:20px;padding:4px;margin-top:18px;
  background:linear-gradient(160deg,var(--tint),transparent 55%)}
.reserve-in{border:1px dashed var(--hair2);border-radius:16px;padding:16px 18px}
.reserve h3{font-family:var(--f-d);font-weight:700;font-size:16px;color:var(--gold2);margin:0}
.reserve .note{font-size:11.5px;color:var(--sand);margin:2px 0 10px}
.ritem{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;
  border-top:1px solid var(--hair)}
.ritem:first-of-type{border-top:0}

/* qahwa heritage block */
.heritage{border:1px solid var(--hair);border-radius:20px;padding:18px;
  background:radial-gradient(120% 100% at 50% 0%,rgba(107,74,36,.35),transparent 65%),var(--card);
  display:flex;gap:16px;align-items:center;margin-bottom:14px}
.heritage svg{width:52px;height:52px;flex:none;color:var(--gold)}
.heritage .h-t{font-family:var(--f-d);font-weight:500;font-size:14px;color:var(--ink)}
.heritage .h-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.9}

/* sets bundle */
.bundle .price .arrow{color:var(--muted);font-size:12px;margin:0 4px}
.flight-steps{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.flight-steps li{display:flex;gap:10px;padding:4px 0;align-items:baseline}
.flight-steps .rn{font-family:var(--f-b);font-weight:600;color:var(--gold);font-size:11px;flex:none}

/* breakfast collapse */
.closed-note{font-size:12px;color:var(--muted);border:1px dashed var(--hair2);
  border-radius:12px;padding:8px 14px;margin-bottom:12px;display:none}
.chapter.after-hours .closed-note{display:block}
.chapter.after-hours .items{opacity:.5}

/* ===== Filters ===== */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 -6px}
.filters:empty{margin:0}
.filters .fl{font-size:11.5px;color:var(--muted)}
.fchip{font-size:12px;color:var(--ink2);border:1px solid var(--hair2);border-radius:999px;
  padding:5px 13px;transition:background .2s,color .2s,transform .18s var(--ease)}
.fchip.on{background:var(--gold);color:var(--on-accent);border-color:var(--gold);font-weight:600}
.fchip:active{transform:scale(.95)}
.card.fhide{display:none}

/* seasonal chapter badge */
.ch-lim{font-family:var(--f-b);font-weight:600;font-size:10.5px;color:var(--gold2);
  border:1px solid var(--hair2);border-radius:999px;padding:2.5px 10px;white-space:nowrap;flex:none}

/* loyalty ribbon */
.loyal{border:1px solid var(--hair2);border-radius:16px;padding:12px 16px;margin-top:16px;
  background:linear-gradient(160deg,var(--tint2),transparent 60%)}
.loyal .lt{font-size:12.5px;color:var(--ink2);margin-top:4px}
.loyal .stamps{display:flex;gap:8px;margin-top:10px}
.loyal .stamp{width:26px;height:26px;border-radius:999px;border:1px dashed var(--hair2);
  display:grid;place-items:center;color:var(--on-accent);font-size:13px;font-weight:700}
.loyal .stamp.f{background:var(--gold);border:1px solid var(--gold)}
.loyal .demo-tag2{font-size:10px;color:var(--muted);margin-top:9px}

/* header state buttons */
.icon-btn.on{background:var(--gold);color:var(--on-accent);border-color:var(--gold)}
#fsBtn{font-size:13px;font-weight:700;direction:ltr}

/* kinetic chapter-title reveal — the reveal rule must match the RTL start
   rule's specificity (html prefix) and come after it, or Arabic titles
   would stay clipped */
@media (prefers-reduced-motion:no-preference){
  .ch-head.r .ch-title{clip-path:inset(0 100% 0 0);transition:clip-path .8s var(--ease) .12s}
  html[dir="rtl"] .ch-head.r .ch-title{clip-path:inset(0 0 0 100%)}
  html .ch-head.r.in .ch-title{clip-path:inset(0 0 0 0)}
}

/* ===== RISE entrance ===== */
@media (prefers-reduced-motion:no-preference){
  .r{opacity:0;transform:translateY(16px);
    transition:opacity .6s var(--ease) var(--d,0s),transform .6s var(--ease) var(--d,0s)}
  .r.in{opacity:1;transform:none}
}

/* steam */
.steam{position:absolute;top:16%;left:50%;transform:translateX(-50%);width:30px;height:26px;
  color:var(--gold2);opacity:.55;pointer-events:none}
.steam path{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .steam path{animation:rise-steam 3.2s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:1.6s}
  @keyframes rise-steam{
    0%{transform:translateY(6px);opacity:0}
    35%{opacity:.8}
    100%{transform:translateY(-8px);opacity:0}
  }
}

/* ===== Cinematic intro ===== */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  transition:opacity .65s var(--ease);cursor:pointer}
#intro.done{opacity:0;pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro-wm{position:relative;font-family:var(--f-d);font-weight:700;color:var(--gold2);
  font-size:clamp(72px,24vw,150px);line-height:1.2;opacity:0;
  filter:drop-shadow(0 0 26px var(--glow));transition:opacity .7s var(--ease)}
#intro.reveal .intro-wm{opacity:1}
.intro-tag{position:absolute;bottom:18vh;inset-inline:0;text-align:center;font-size:14px;
  color:var(--muted);opacity:0;transition:opacity .6s var(--ease) .15s}
#intro.reveal .intro-tag{opacity:1}
.intro-skip{position:absolute;bottom:6vh;inset-inline:0;text-align:center;font-size:11px;
  color:var(--muted);opacity:.55;letter-spacing:.08em}

/* ===== Bottom order bar ===== */
.orderbar{
  position:fixed;bottom:14px;inset-inline:0;z-index:45;margin:0 auto;max-width:calc(var(--maxw) - 36px);
  background:var(--glass2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--hair2);border-radius:20px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  transform:translateY(130%);transition:transform .45s var(--ease)}
.orderbar.show{transform:none}
.ob-count{width:30px;height:30px;border-radius:999px;background:var(--gold);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
@keyframes bounce{0%,100%{transform:scale(1)}45%{transform:scale(1.28)}}
.ob-count.bump{animation:bounce .45s var(--ease)}
.ob-total{font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;flex:1}
.ob-total small{color:var(--muted);font-weight:400;font-size:11.5px;display:block;line-height:1.3}
.ob-cta{background:var(--gold);color:var(--on-accent);font-weight:700;font-size:13.5px;
  border-radius:14px;padding:10px 16px;transition:transform .18s var(--ease)}
.ob-cta:active{transform:scale(.95)}
.fly{position:fixed;z-index:80;width:12px;height:12px;border-radius:999px;background:var(--gold2);
  pointer-events:none;box-shadow:0 0 12px var(--glow2)}

/* ===== Sheets ===== */
.scrim{position:fixed;inset:0;background:var(--scrimc);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .35s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:60;margin:0 auto;max-width:var(--maxw);
  background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--hair2);border-bottom:0;
  max-height:88dvh;display:flex;flex-direction:column;
  transform:translateY(104%);transition:transform .45s var(--ease);
  touch-action:none;
}
.sheet.show{transform:none}
.sheet.drag{transition:none}
.grabber{width:44px;height:5px;border-radius:999px;background:var(--hair2);margin:10px auto 2px;flex:none}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding:6px 22px 12px;touch-action:pan-y}
.sheet .art{height:170px;border-radius:200px 200px 18px 18px / 300px 300px 18px 18px;
  display:grid;place-items:center;position:relative;margin:8px 0 14px}
.sheet .art svg.item-ic{width:70px;height:70px}
.sheet h2{font-family:var(--f-d);font-weight:700;font-size:21px;margin:0;line-height:1.5}
.sheet .price{font-size:20px}
.sheet .desc{font-size:14px;margin-top:6px}
.sheet .meta{margin-top:10px}
.opt-group{margin-top:18px}
.opt-title{font-family:var(--f-d);font-weight:500;font-size:13px;color:var(--sand);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:12.5px;color:var(--ink2);border:1px solid var(--hair2);border-radius:999px;
  padding:7px 14px;transition:all .2s var(--ease)}
.opt.on{background:var(--gold);color:var(--on-accent);border-color:var(--gold);font-weight:600}
.opt:active{transform:scale(.95)}
.opt .pp{font-size:10.5px;opacity:.75}
.sheet-cta-row{display:flex;gap:12px;align-items:center;margin-top:24px;
  position:sticky;bottom:0;background:var(--bg2);padding:10px 0;
  box-shadow:0 -14px 18px -10px rgba(10,8,6,.55)}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--hair2);border-radius:14px}
.qty button{width:38px;height:44px;font-size:19px;color:var(--gold2)}
.qty span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sheet-add{flex:1;background:var(--gold);color:var(--on-accent);font-weight:700;font-size:14.5px;
  border-radius:14px;padding:13px 14px;transition:transform .18s var(--ease)}
.sheet-add:active{transform:scale(.97)}
.story-line{font-size:12.5px;color:var(--sand);border-inline-start:2px solid var(--gold);
  padding-inline-start:12px;margin-top:12px;line-height:2}

/* cart */
.cart-lines{margin:6px 0 0;padding:0;list-style:none}
.cart-lines li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair)}
.cl-nm{flex:1;font-size:14px}
.cl-nm small{display:block;color:var(--muted);font-size:11px}
.cl-pr{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.suggest{border:1px dashed var(--hair2);border-radius:16px;padding:12px 16px;margin-top:16px;
  display:flex;align-items:center;gap:12px}
.suggest .s-t{flex:1;font-size:12.5px;color:var(--ink2)}
.suggest button{flex:none;font-size:12px;font-weight:600;color:var(--gold2);
  border:1px solid var(--hair2);border-radius:999px;padding:6px 13px}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;
  font-family:var(--f-d);font-weight:700;font-size:17px}
.vat-note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:#22A55A;color:#fff;font-weight:700;font-size:15px;border-radius:16px;
  padding:14px;margin-top:14px;transition:transform .18s var(--ease)}
.wa-btn:active{transform:scale(.97)}
.wa-btn svg{width:20px;height:20px}
/* status strip */
.status{display:none;margin-top:18px;border:1px solid var(--hair);border-radius:16px;padding:14px 16px}
.status.show{display:block}
.status .demo-tag{font-size:10px;color:var(--muted);text-align:center;margin-top:8px}
.steps{display:flex;justify-content:space-between;position:relative;margin-top:6px}
.steps::before{content:"";position:absolute;top:9px;inset-inline:20px;height:2px;background:var(--hair)}
.step{position:relative;z-index:1;text-align:center;flex:1;font-size:10.5px;color:var(--muted)}
.step .sdot{width:20px;height:20px;border-radius:999px;border:2px solid var(--hair2);
  background:var(--bg2);margin:0 auto 5px;display:grid;place-items:center;transition:all .4s}
.step.done .sdot{background:var(--green);border-color:var(--green)}
.step.done{color:var(--green)}
.quick{display:flex;gap:8px;margin-top:16px}
.quick button{flex:1;font-size:11.5px;color:var(--ink2);border:1px solid var(--hair2);
  border-radius:12px;padding:9px 4px;transition:transform .18s var(--ease)}
.quick button:active{transform:scale(.95)}

/* toast */
.toast{position:fixed;bottom:96px;inset-inline:0;margin:0 auto;width:max-content;max-width:85vw;
  z-index:90;background:var(--glass3);backdrop-filter:blur(12px);border:1px solid var(--hair2);
  color:var(--ink);font-size:12.5px;border-radius:999px;padding:9px 18px;
  opacity:0;transform:translateY(10px);transition:all .35s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ===== Footer ===== */
footer{margin-top:56px;border-top:1px solid var(--hair);padding-top:26px;
  font-size:12px;color:var(--muted);text-align:center}
footer .f-block{margin-bottom:18px;line-height:2}
.paystrip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.paychip{font-size:10.5px;font-weight:600;color:var(--ink2);border:1px solid var(--hair);
  border-radius:8px;padding:4px 11px}
.allergen-legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.allergen-legend .mi{display:inline-flex;gap:4px;align-items:center}
.allergen-legend svg{width:12px;height:12px}
.credit{margin-top:26px;padding:16px;border:1px solid var(--hair);border-radius:18px;
  background:linear-gradient(160deg,var(--tint2),transparent 60%)}
.credit a{font-family:var(--f-d);font-weight:500}
.kufic-mark{position:fixed;z-index:-1;inset-inline-end:-8vw;top:30vh;
  font-family:var(--f-d);font-weight:700;font-size:44vh;color:var(--watermark);
  line-height:1;pointer-events:none;user-select:none}

@media (prefers-reduced-motion:reduce){
  .wordmark .mask{animation:none}
  .parade-track{animation:none}
  .parade{overflow-x:auto}
  html{scroll-behavior:auto}
}
@media (min-width:700px){
  body{padding-top:8px}
}

/* text-size steps (kept last so they win the cascade) */
html[data-fs="1"] body{font-size:17.5px}
html[data-fs="1"][lang="ar"] body{font-size:18.5px}
html[data-fs="2"] body{font-size:19px}
html[data-fs="2"][lang="ar"] body{font-size:20px}
</style>

function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function num(n){ return '<bdi>'+n+'</bdi>'; }
function badgeHtml(m){
  var b=[];
  if(m.badge==="best") b.push('<span class="badge">'+t(T.bestSeller)+'</span>');
  if(m.badge==="chef") b.push('<span class="badge">'+t(T.chefPick)+'</span>');
  if(m.badge==="new") b.push('<span class="badge">'+t(T.newBadge)+'</span>');
  if(m.badge==="unesco") b.push('<span class="badge soft">'+t(T.unesco)+'</span>');
  return b.length?'<div class="badges">'+b.join("")+'</div>':"";
}
function metaHtml(m,long){
  var p=[];
  if(m.kcal!=null) p.push('<span class="mi">'+mi("fire")+num(m.kcal)+' '+t(T.kcal)+'</span>');
  if(m.caf) p.push('<span class="mi">'+mi("caf")+num(m.caf)+' '+t(T.caffeine)+'</span>');
  if(m.walk) p.push('<span class="mi">'+mi("walk")+num(m.walk)+' '+t(T.walk)+'</span>');
  if(m.salt) p.push('<span class="mi">'+mi("salt")+t(T.salt)+'</span>');
  (m.allergens||[]).forEach(function(a){
    var key={nuts:"alNuts",dairy:"alDairy",gluten:"alGluten",egg:"alEgg",sesame:"alSesame"}[a];
    p.push('<span class="mi" title="'+t(T[key])+'">'+mi(a)+(long?t(T[key]):"")+'</span>');
  });
  return p.length?'<div class="meta">'+p.join("")+'</div>':"";
}
function priceHtml(m){
  var h='<span class="price">';
  if(m.was) h+='<s>'+num(m.was)+'</s>';
  h+=num(m.price)+'</span>';
  return h;
}
function artHtml(m,steam){
  return '<div class="art" style="background:'+ART[m.art]+',var(--card2)">'
    +IC(m.ic)
    +((steam&&m.steam)?'<svg class="steam" viewBox="0 0 30 26"><path d="M9 22c-2-3 2-5 0-9"/><path d="M20 22c-2-3 2-5 0-9"/></svg>':"")

function pairsHtml(m){

  return '<div class="pairs"><button data-goto="'+m.pairs+'">'+t(T.pairs)+' · '+t(byId[m.pairs].nm)+'</button></div>';

function windowHtml(m){

}
function locNum(n){
  if(LANG!=="ar") return String(n);
  return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[+d];});
}

/* ================ Dietary filters ================ */
var FILTERS={nuts:false,dairy:false,vegan:false,decaf:false};
function anyFilter(){ return FILTERS.nuts||FILTERS.dairy||FILTERS.vegan||FILTERS.decaf; }
function passFilters(m){
  var al=m.allergens||[];
  if(FILTERS.nuts&&al.indexOf("nuts")>-1) return false;
  if(FILTERS.dairy&&al.indexOf("dairy")>-1) return false;
  if(FILTERS.vegan&&(al.indexOf("dairy")>-1||al.indexOf("egg")>-1)) return false;
  if(FILTERS.decaf&&(m.caf||0)>0) return false;
  return true;
}
function renderFilters(){
  var defs=[["nuts",T.fNuts],["dairy",T.fDairy],["vegan",T.fVegan],["decaf",T.fDecaf]];
  document.getElementById("filters").innerHTML=
    '<span class="fl">'+t(T.filterLabel)+'</span>'
    +defs.map(function(d){return '<button class="fchip'+(FILTERS[d[0]]?" on":"")+'" data-f="'+d[0]+'" aria-pressed="'+FILTERS[d[0]]+'">'+t(d[1])+'</button>';}).join("");
}
function applyFilters(){
  var on=anyFilter(), n=0;
  document.querySelectorAll("#menu .card[data-open]").forEach(function(el){
    var m=byId[el.dataset.open]; if(!m) return;
    var hide=on&&!passFilters(m);
    el.classList.toggle("fhide",hide);
    if(!hide) n++;
  });
  return n;
}
document.getElementById("filters").addEventListener("click",function(e){
  var f=e.target.closest(".fchip"); if(!f) return;
  FILTERS[f.dataset.f]=!FILTERS[f.dataset.f];
  f.classList.toggle("on",FILTERS[f.dataset.f]);
  f.setAttribute("aria-pressed",FILTERS[f.dataset.f]);
  var n=applyFilters();
  if(anyFilter()) toast(locNum(n)+" "+t(T.fCount));
});

/* ================ Chips + scrollspy ================ */
function bindChips(){
  document.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      var sec=document.getElementById("ch-"+ch.dataset.chip);
      if(sec) sec.scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}
var curChipId=null;
function setActiveChip(id){
  curChipId=id;
  var chips=document.querySelectorAll(".chip");
  var glider=document.getElementById("glider");
  chips.forEach(function(c){c.classList.toggle("on",c.dataset.chip===id);});
  var act=document.querySelector('.chip[data-chip="'+id+'"]');
  if(act&&glider){
    glider.style.width=act.offsetWidth+"px";
    glider.style.transform="translateX("+act.offsetLeft+"px)";
    requestAnimationFrame(function(){glider.classList.add("ready");});
    var box=act.parentElement;
    var target=act.offsetLeft-(box.clientWidth-act.offsetWidth)/2;
    box.scrollTo({left:target,behavior:"smooth"});
  }
}
var spyIO;
function observeSpy(){
  if(spyIO) spyIO.disconnect();
  spyIO=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting) setActiveChip(en.target.dataset.ch); });
  },{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll(".chapter").forEach(function(s){spyIO.observe(s);});
  setActiveChip(activeChapters()[0].id);
}

/* ================ RISE ================ */
var riseIO;
function observeRise(){
  if(riseIO) riseIO.disconnect();
  riseIO=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); riseIO.unobserve(en.target);} });
  },{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".r").forEach(function(el){riseIO.observe(el);});
}

function checkBreakfast(){
  var sec=document.getElementById("ch-bf");
  if(!sec) return;
  var h=new Date().getHours();
  sec.classList.toggle("after-hours",h>=12||h<6);
}

/* ================ Cart ================ */
var cart=[];
try{ cart=JSON.parse(localStorage.getItem("wasm-cart")||"[]"); }catch(e){ cart=[]; }
cart=Array.isArray(cart)?cart.filter(function(l){
  return l&&byId[l.id]&&Array.isArray(l.mods)&&typeof l.qty==="number"&&l.qty>0&&typeof l.unit==="number";
}):[];
function saveCart(){ localStorage.setItem("wasm-cart",JSON.stringify(cart)); }
function cartCount(){ return cart.reduce(function(n,l){return n+l.qty;},0); }
function cartTotal(){ return cart.reduce(function(n,l){return n+l.qty*l.unit;},0); }
var lastTotal=0;
function updateOrderBar(instant){
  var bar=document.getElementById("orderbar");
  var n=cartCount();
  bar.classList.toggle("show",n>0);
  document.getElementById("obCount").textContent=n;
  var tot=cartTotal();
  var el=document.getElementById("obTotal");
  if(instant||Math.abs(tot-lastTotal)<1){ el.textContent=tot; lastTotal=tot; return; }
  var from=lastTotal,start=null;
  function tick(ts){
    if(!start) start=ts;
    var p=Math.min((ts-start)/380,1);
    el.textContent=Math.round(from+(tot-from)*p);
    if(p<1) requestAnimationFrame(tick); else lastTotal=tot;
  }
  requestAnimationFrame(tick);
}
function bump(){
  var c=document.getElementById("obCount");
  c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
}
function fly(fromEl){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var r=fromEl.getBoundingClientRect();
  var cnt=document.getElementById("obCount").getBoundingClientRect();
  var dot=document.createElement("span");
  dot.className="fly";
  dot.style.left=(r.left+r.width/2-6)+"px";dot.style.top=(r.top+r.height/2-6)+"px";
  document.body.appendChild(dot);
  var dx=(cnt.left+cnt.width/2)-(r.left+r.width/2), dy=(cnt.top+cnt.height/2)-(r.top+r.height/2);
  dot.animate([{transform:"translate(0,0) scale(1)",opacity:1},
    {transform:"translate("+dx*0.5+"px,"+(dy-70)+"px) scale(.9)",opacity:1,offset:.6},
    {transform:"translate("+dx+"px,"+dy+"px) scale(.4)",opacity:.4}],
    {duration:560,easing:"cubic-bezier(.32,.72,.28,1)"}).onfinish=function(){dot.remove();};
}
function addToCart(id,mods,qty,fromEl){
  var m=byId[id]; if(!m) return;
  var unit=m.price+(mods||[]).reduce(function(n,x){return n+(x.p||0);},0);
  var sig=id+"|"+(mods||[]).map(function(x){return x.id||x.nm && x.nm.en||"";}).join(",");
  var line=cart.find(function(l){return l.sig===sig;});
  if(line) line.qty+=qty||1;
  else cart.push({sig:sig,id:id,qty:qty||1,unit:unit,mods:(mods||[]).map(function(x){return {nm:x.nm,p:x.p||0};})});
  saveCart();
  if(fromEl) fly(fromEl);
  setTimeout(function(){updateOrderBar();bump();},fromEl?380:0);
  toast(t(T.toastAdd));
}

/* toast */
var toastTimer;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove("show");},2200);
}

/* ================ Sheets ================ */
var openSheet=null,lastFocus=null;
function showSheet(id){
  var sh=document.getElementById(id);
  lastFocus=document.activeElement;
  document.getElementById("scrim").classList.add("show");
  sh.classList.add("show");
  document.body.classList.add("sheet-open");
  openSheet=sh;
  sh.querySelector(".sheet-scroll").scrollTop=0;
  sh.focus();
}
function hideSheets(){
  document.getElementById("scrim").classList.remove("show");
  ["itemSheet","cartSheet"].forEach(function(x){document.getElementById(x).classList.remove("show");});
  document.body.classList.remove("sheet-open");
  openSheet=null;
  if(lastFocus&&document.contains(lastFocus)&&lastFocus.focus){lastFocus.focus();}
  lastFocus=null;
}
document.getElementById("scrim").addEventListener("click",hideSheets);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") hideSheets(); });

/* drag-to-dismiss */
["itemSheet","cartSheet"].forEach(function(id){
  var sh=document.getElementById(id);
  var startY=null,curY=0,startT=0;
  sh.addEventListener("pointerdown",function(e){
    var sc=sh.querySelector(".sheet-scroll");
    if(sc.contains(e.target)&&sc.scrollTop>2) return;
    startY=e.clientY;curY=0;startT=performance.now();
    sh.classList.add("drag");
    sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener("pointermove",function(e){
    if(startY==null) return;
    curY=Math.max(0,e.clientY-startY);
    sh.style.transform="translateY("+curY+"px)";
  });
  function endDrag(){
    if(startY==null) return;
    sh.classList.remove("drag");
    var dt=performance.now()-startT;
    var v=curY/Math.max(dt,1);
    sh.style.transform="";
    if(curY>130||v>0.55) hideSheets();
    startY=null;
  }
  sh.addEventListener("pointerup",endDrag);
  sh.addEventListener("pointercancel",endDrag);
});

/* item sheet */
var curItem=null,curMods={},curQty=1;
function openItem(id){
  var m=byId[id]; if(!m) return;
  curItem=m;curMods={};curQty=1;
  var b=document.getElementById("itemSheetBody");
  var h=artHtml(m,true)
    +'<div class="row-top"><h2>'+t(m.nm)+'</h2>'+priceHtml(m)+'</div>'
    +'<p class="desc">'+t(m.ds)+'</p>'
    +(m.story?'<p class="story-line">'+t(T[m.story])+'</p>':"")
    +metaHtml(m,true);
  (m.custom||[]).forEach(function(ck){
    var g=CUSTOM[ck];
    curMods[ck]=g.def;
    h+='<div class="opt-group"><div class="opt-title">'+t(T[g.t])+'</div><div class="opts">'
      +g.opts.map(function(o,j){return '<button class="opt'+(j===g.def?" on":"")+'" data-cg="'+ck+'" data-ci="'+j+'">'+t(o)
        +(o.p?' <span class="pp">+'+o.p+'</span>':'')+'</button>';}).join("")
      +'</div></div>';
  });
  if(m.addons){
    h+='<div class="opt-group"><div class="opt-title">'+t(T.addons)+'</div><div class="opts">'
      +ADDONS.map(function(a,j){return '<button class="opt" data-ao="'+j+'">'+t(a.nm)+' <span class="pp">+'+a.p+'</span></button>';}).join("")
      +'</div></div>';
  }
  h+='<div class="sheet-cta-row">'
    +'<div class="qty"><button data-q="-1" aria-label="'+t(T.qtyMinus)+'">−</button><span id="qtyN">1</span><button data-q="1" aria-label="'+t(T.qtyPlus)+'">+</button></div>'
    +'<button class="sheet-add" id="sheetAdd">'+t(T.addToOrder)+' · <bdi id="sheetPrice">'+m.price+'</bdi></button>'
    +'</div>';
  b.innerHTML=h;
  showSheet("itemSheet");
}
function sheetUnit(){
  var u=curItem.price;
  Object.keys(curMods).forEach(function(ck){
    var o=CUSTOM[ck].opts[curMods[ck]];
    u+=(o&&o.p)||0;
  });
  document.querySelectorAll('#itemSheetBody .opt[data-ao].on').forEach(function(el){
    u+=ADDONS[+el.dataset.ao].p;
  });
  return u;
}
function refreshSheetPrice(){
  var el=document.getElementById("sheetPrice");
  if(el) el.textContent=sheetUnit()*curQty;
  var q=document.getElementById("qtyN"); if(q) q.textContent=curQty;
}
document.getElementById("itemSheetBody").addEventListener("click",function(e){
  var opt=e.target.closest(".opt");
  if(opt){
    if(opt.dataset.cg!=null){
      document.querySelectorAll('#itemSheetBody .opt[data-cg="'+opt.dataset.cg+'"]').forEach(function(x){x.classList.remove("on");});
      opt.classList.add("on");curMods[opt.dataset.cg]=+opt.dataset.ci;
    } else if(opt.dataset.ao!=null){ opt.classList.toggle("on"); }
    refreshSheetPrice();return;
  }
  var qb=e.target.closest("[data-q]");
  if(qb){ curQty=Math.max(1,curQty+(+qb.dataset.q)); refreshSheetPrice(); return; }
  if(e.target.closest("#sheetAdd")){
    var mods=[];
    Object.keys(curMods).forEach(function(ck){
      var g=CUSTOM[ck];
      if(curMods[ck]!==g.def){
        var o=g.opts[curMods[ck]];
        mods.push({id:ck+curMods[ck],nm:{ar:T[g.t].ar+": "+o.ar,en:T[g.t].en+": "+o.en},p:o.p||0});
      }
    });
    document.querySelectorAll('#itemSheetBody .opt[data-ao].on').forEach(function(el){
      var a=ADDONS[+el.dataset.ao];mods.push({id:a.id,nm:a.nm,p:a.p});
    });
    addToCart(curItem.id,mods,curQty,e.target);
    hideSheets();
  }
});

/* cart sheet */
function renderCart(){
  var b=document.getElementById("cartSheetBody");
  if(!cart.length){ b.innerHTML='<h2>'+t(T.yourOrder)+'</h2><p class="desc">—</p>'; return; }
  var lines=cart.map(function(l,i){
    var m=byId[l.id];
    return '<li><span class="cl-nm">'+t(m.nm)
      +(l.mods.length?'<small>'+l.mods.map(function(x){return t(x.nm);}).join(" · ")+'</small>':"")
      +'</span>'
      +'<span class="qty" style="border-radius:10px"><button data-cq="-1" data-i="'+i+'" aria-label="'+t(T.qtyMinus)+'">−</button><span>'+l.qty+'</span><button data-cq="1" data-i="'+i+'" aria-label="'+t(T.qtyPlus)+'">+</button></span>'
      +'<span class="cl-pr">'+num(l.unit*l.qty)+'</span></li>';
  }).join("");
  var hasSweet=cart.some(function(l){return byId[l.id].ch==="sweet";});
  var goal=5,cnt=Math.min(cartCount(),goal),stamps="";
  for(var s=0;s<goal;s++){stamps+='<span class="stamp'+(s<cnt?" f":"")+'">'+(s<cnt?"✓":"")+'</span>';}
  var left=goal-cnt;
  var lt=left<=0?t(T.loyalDone):(left===1?t(T.loyalLeft1):t(T.loyalLeft).replace("{n}",locNum(left)));
  var loyal='<div class="loyal"><span class="eyebrow">'+t(T.loyalT)+'</span>'
    +'<div class="lt">'+lt+'</div><div class="stamps">'+stamps+'</div>'
    +'<div class="demo-tag2">'+t(T.loyalDemo)+'</div></div>';
  b.innerHTML='<h2>'+t(T.yourOrder)+'</h2>'
    +'<ul class="cart-lines">'+lines+'</ul>'
    +loyal
    +(!hasSweet?'<div class="suggest"><span class="s-t">'+t(T.suggest)+'</span><button data-sug="saffron-cake">'+t(T.addIt)+' · '+num(24)+'</button></div>':"")
    +'<div class="cart-total"><span>'+t(T.total)+'</span><span>'+num(cartTotal())+' '+t(T.sar)+'</span></div>'
    +'<div class="vat-note">'+t(T.vatNote)+'</div>'
    +'<a class="wa-btn" id="waOrder" target="_blank" rel="noopener">'
    +'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.2 14.1c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4-4.9-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.7.3.2.5.1.7-.1l1-1.1c.2-.3.4-.2.7-.1l2.1 1c.3.2.5.3.6.4 0 .2 0 .7-.2 1.3Z"/></svg>'
    +t(T.orderWa)+'</a>'
    +'<div class="status" id="orderStatus">'
    +'<div class="steps">'
    +'<div class="step" id="st1"><div class="sdot"></div>'+t(T.received)+'</div>'
    +'<div class="step" id="st2"><div class="sdot"></div>'+t(T.preparing)+'</div>'
    +'<div class="step" id="st3"><div class="sdot"></div>'+t(T.ready)+'</div>'
    +'</div><div class="demo-tag">'+t(T.demoTag)+'</div></div>'
    +'<div class="quick">'
    +'<button data-qa="bill">'+t(T.reqBill)+'</button>'
    +'<button data-qa="waiter">'+t(T.callWaiter)+'</button>'
    +'<button data-qa="rate">★ '+t(T.rateUs)+'</button>'
    +'</div>';
  var wa=document.getElementById("waOrder");
  wa.href="https://wa.me/966500000000?text="+encodeURIComponent(waMessage());
}
function waMessage(){
  var L=[t(T.newOrder),t(T.table)+": 12",""];
  cart.forEach(function(l){
    var m=byId[l.id];
    L.push("• "+t(m.nm)+" ×"+l.qty+(l.mods.length?" ("+l.mods.map(function(x){return t(x.nm);}).join(LANG==="ar"?"، ":", ")+")":""));
  });
  L.push("");L.push(t(T.waMsgTotal)+": "+cartTotal()+" "+t(T.sar));
  return L.join("\n");
}
document.getElementById("obView").addEventListener("click",function(){renderCart();showSheet("cartSheet");});
document.getElementById("cartSheetBody").addEventListener("click",function(e){
  var cq=e.target.closest("[data-cq]");
  if(cq){
    var l=cart[+cq.dataset.i];
    l.qty+=+cq.dataset.cq;
    if(l.qty<=0) cart.splice(+cq.dataset.i,1);
    saveCart();updateOrderBar();renderCart();
    if(!cart.length) hideSheets();
    return;
  }
  var sug=e.target.closest("[data-sug]");
  if(sug){ addToCart(sug.dataset.sug,[],1,sug); renderCart(); return; }
  var qa=e.target.closest("[data-qa]");
  if(qa){
    if(qa.dataset.qa==="waiter") toast(t(T.toastWaiter));
    else if(qa.dataset.qa==="bill") toast(t(T.toastBill));
    else toast("★★★★★");
    return;
  }
  if(e.target.closest("#waOrder")){
    var st=document.getElementById("orderStatus");
    st.classList.add("show");
    setTimeout(function(){document.getElementById("st1").classList.add("done");},400);
    setTimeout(function(){document.getElementById("st2").classList.add("done");},2200);
    setTimeout(function(){document.getElementById("st3").classList.add("done");},4600);
  }
});

/* ================ Global card clicks ================ */
document.addEventListener("click",function(e){
  if(e.target.closest(".after-hours")&&e.target.closest("[data-add],[data-open]")){
    toast(t(T.breakfastClosed));return;
  }
  var add=e.target.closest("[data-add]");
  if(add){ e.stopPropagation(); addToCart(add.dataset.add,[],1,add); return; }
  var go=e.target.closest("[data-goto]");
  if(go){ e.stopPropagation(); openItem(go.dataset.goto); return; }
  var op=e.target.closest("[data-open]");
  if(op){ openItem(op.dataset.open); return; }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ") return;
  if(!e.target.closest) return;
  if(e.target.closest("[data-add],[data-goto]")) return;
  var op=e.target.closest("[data-open]");
  if(op){ e.preventDefault(); openItem(op.dataset.open); }
});

/* ================ Cinematic intro ================ */
(function(){
  var overlay=document.getElementById("intro");
  if(!overlay) return;
  var qs=new URLSearchParams(location.search);
  var demo=qs.get("demo")==="1";
  var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var seen=false;
  try{ seen=sessionStorage.getItem("wasm-intro-seen")==="1"; }catch(e){}
  if(qs.get("intro")==="0"||(seen&&!demo)){ overlay.remove(); return; }
  try{ sessionStorage.setItem("wasm-intro-seen","1"); }catch(e){}
  overlay.querySelector(".intro-tag").textContent=t(T.tagline);
  var HOLD=demo?2400:600;
  var finished=false;
  function finish(){
    if(finished) return; finished=true;
    overlay.classList.add("done");
    setTimeout(function(){ overlay.remove(); },700);
  }
  overlay.addEventListener("pointerdown",finish);
  if(reduced){
    overlay.classList.add("reveal");
    setTimeout(finish,1200);
    return;
  }
  var cv=document.getElementById("introCanvas"),cx=cv.getContext("2d");
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.scale(dpr,dpr);
  var css=getComputedStyle(document.documentElement);
  var gold=(css.getPropertyValue("--gold2")||"#E2C283").trim();
  var gold2=(css.getPropertyValue("--gold")||"#C9A25C").trim();
  var targets=[],parts=[];
  function sample(){
    var ow=Math.min(W,560),oh=Math.round(ow*0.5);
    var oc=document.createElement("canvas");
    oc.width=ow;oc.height=oh;
    var o=oc.getContext("2d",{willReadFrequently:true});
    o.fillStyle="#000";
    o.font="700 "+Math.round(ow*0.3)+"px 'Noto Kufi Arabic', sans-serif";
    o.textAlign="center";o.textBaseline="middle";
    o.fillText("وَسْم",ow/2,oh/2);
    var data=o.getImageData(0,0,ow,oh).data;
    var step=Math.max(4,Math.round(ow/85));
    var offX=(W-ow)/2, offY=H/2-oh/2;
    for(var y=0;y<oh;y+=step) for(var x=0;x<ow;x+=step){
      if(data[(y*ow+x)*4+3]>128) targets.push({x:offX+x,y:offY+y});
    }
  }
  function makeParts(){
    for(var i=0;i<targets.length;i++){
      var a=Math.random()*Math.PI*2, r=36*Math.random();
      parts.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,
        vx:(Math.random()-.5)*13,vy:(Math.random()-.72)*13,
        tx:targets[i].x,ty:targets[i].y,s:1+Math.random()*1.6,
        c:Math.random()<.7?gold:gold2});
    }
  }
  var phase=0,phaseStart=null,drop={y:-24};
  function frame(ts){
    if(finished) return;
    if(phaseStart==null) phaseStart=ts;
    var e=ts-phaseStart;
    cx.clearRect(0,0,W,H);
    if(phase===0){
      drop.y+=(H/2-drop.y)*0.15+2.4;
      cx.beginPath();cx.arc(W/2,drop.y,5,0,7);cx.fillStyle=gold;cx.fill();
      if(drop.y>H/2-9){ phase=1;phaseStart=ts;makeParts(); }
    } else if(phase===1){
      var done=0;
      for(var i=0;i<parts.length;i++){
        var p=parts[i];
        if(e<520){ p.x+=p.vx; p.y+=p.vy; p.vx*=.92; p.vy=p.vy*.92+.24; }
        else {
          p.x+=(p.tx-p.x)*.09; p.y+=(p.ty-p.y)*.09;
          if(Math.abs(p.tx-p.x)<1.4&&Math.abs(p.ty-p.y)<1.4) done++;
        }
        cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fillStyle=p.c;cx.fill();
      }
      if((e>1250&&done>parts.length*0.85)||e>2300){
        phase=2;phaseStart=ts;overlay.classList.add("reveal");
      }
    } else {
      cx.globalAlpha=Math.max(0,1-e/450);
      for(var j=0;j<parts.length;j++){
        var q=parts[j];
        cx.beginPath();cx.arc(q.tx,q.ty,q.s,0,7);cx.fillStyle=q.c;cx.fill();
      }
      cx.globalAlpha=1;
      if(e>650+HOLD){ finish(); return; }
    }
    requestAnimationFrame(frame);
  }
  var started=false;
  function start(){
    if(started||finished) return; started=true;
    sample();
    if(!targets.length){ overlay.classList.add("reveal"); setTimeout(finish,1300); return; }
    requestAnimationFrame(frame);
  }
  if(document.fonts&&document.fonts.load){
    var fb=setTimeout(start,750);
    document.fonts.load("700 32px 'Noto Kufi Arabic'").then(function(){
      clearTimeout(fb);start();
    }).catch(function(){ clearTimeout(fb);start(); });
  } else start();
})();
</script>
